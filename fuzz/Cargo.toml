[package]
name = "oxideav-avif-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"
# libloading is the only libavif interop: the cross-decode harness
# `dlopen`s the system-installed libavif at startup. No `*-sys` crate,
# no libavif source pulled into the dep tree. Harnesses skip silently
# when libavif isn't installed (see fuzz/src/lib.rs).
libloading = "0.8"

[dependencies.oxideav-avif]
path = ".."

[lib]
name = "oxideav_avif_fuzz"
path = "src/lib.rs"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

# Cross-decode + self-roundtrip harnesses. oxideav-avif now ships a
# real pixel encoder (the `still` module driving oxideav-av1's
# KEY-frame encoder), so the literal #304 self-roundtrip runs in-tree
# (oxideav_encode_oxideav_decode_roundtrip, byte-exact lossless). The
# libavif-driven harnesses keep the cross-implementation legs: pixel
# cross-validation against libavif's decoder on the same bitstream,
# and round-trip stability across a libavif re-encode.

# Round 1 (#345) — encode with libavif, decode with oxideav-avif,
# tolerate decoder errors but assert dimensions on success.
[[bin]]
name = "libavif_encode_oxideav_decode"
path = "fuzz_targets/libavif_encode_oxideav_decode.rs"
test = false
doc = false

# Round 2 #304 (b) — encode with libavif lossless YUV444+IDENTITY,
# decode with BOTH oxideav-avif and libavif, assert pixel match.
# Skipped silently when libavif isn't installed.
[[bin]]
name = "libavif_encode_oxideav_libavif_decode_match"
path = "fuzz_targets/libavif_encode_oxideav_libavif_decode_match.rs"
test = false
doc = false

# Round 2 #304 (a) — oxideav decode → libavif re-encode → oxideav
# decode → assert the two oxideav-decoded planes match: validates
# oxideav-avif's decoder is bit-stable under a re-encode by libavif.
[[bin]]
name = "libavif_oxideav_reencode_roundtrip"
path = "fuzz_targets/libavif_oxideav_reencode_roundtrip.rs"
test = false
doc = false

# #304 literal self-roundtrip — oxideav encode (lossless identity RGBA
# + alpha auxiliary) → oxideav decode → assert byte-exact pixels.
# Fully in-tree; never skips.
[[bin]]
name = "oxideav_encode_oxideav_decode_roundtrip"
path = "fuzz_targets/oxideav_encode_oxideav_decode_roundtrip.rs"
test = false
doc = false
